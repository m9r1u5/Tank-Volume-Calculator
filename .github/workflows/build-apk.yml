name: Build Android APK

# Runs on every push to main and can be started by hand (Actions tab -> Build Android APK -> Run workflow).
# Result: a downloadable APK on the Releases page (and as a workflow artifact).
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy web files into www/
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png maskable-512.png apple-touch-icon.png www/

      - name: Install Capacitor and add Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Use our app icon instead of the default
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${size}x${size} $RES/mipmap-$dir/$n.png
            done
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tank-volume-calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tank-volume-calculator-apk
          path: tank-volume-calculator.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tank Volume Calculator APK ${{ github.run_number }}
          body: Android APK build ${{ github.run_number }}. Download tank-volume-calculator.apk, open it on your phone and tap Install (allow "install unknown apps" if asked).
          files: tank-volume-calculator.apk
          make_latest: true
